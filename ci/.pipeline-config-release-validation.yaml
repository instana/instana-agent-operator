# Required: release-state-path=<exact candidate prefix>/bom.json.
# Optional: validation-upload-report=true (default false); writes only a report
# under pipeline-validation/<validation-run-id>/report.json in the COS bucket.
version: '2'
tasks:
  simple-execute:
    runtimeClassName: large
    steps:
      - name: execute
        onError: stopAndFail
        image: icr.io/instana-agent-dev/agent-delivery/build-image:main
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          SCRIPTS="${WORKSPACE}/${PIPELINE_CONFIG_REPO_PATH}/ci/sps-scripts"
          bash "${SCRIPTS}/run-promotion-validation.sh"
