# Release-build pipeline for instana-agent-operator + instana-agent-charts.
# Trigger: Manual only (SPS toolchain UI). No commit-push trigger.
# See: ci/RELEASE-PIPELINE-DESIGN.md
#
# Pipeline properties — set these in the SPS toolchain UI (not in this file):
#   release-line   required  MAJOR.MINOR of the release line to publish (e.g. "2.2")
#                            Patch is computed automatically from existing tags.
#   release-branch default: main
version: '2'

tasks:
  # "code-setup" is the standard SPS slot that runs before code-checks / code-build.
  # Using this name is required: user-defined task names that are not present in the
  # base compliance pipeline cannot be referenced in runAfter — Tekton's admission
  # webhook rejects PipelineRuns where a runAfter dependency is absent from spec.tasks.
  code-setup:
    steps:
      - name: run-stage
        image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3
        script: |
          #!/usr/bin/env bash
          source $WORKSPACE/$APP_REPO_FOLDER/ci/sps-scripts/prepare.sh

  # code-checks already has runAfter: [code-setup] in the base pipeline; the
  # runAfter entry is kept here for explicitness but is not strictly required.
  code-checks:
    runAfter:
      - code-setup
    include:
      - dind
    steps:
      - name: detect-secrets
        include:
          - docker-socket
      - name: compliance-checks
        include:
          - docker-socket
      - name: static-scan
        include:
          - docker-socket

  # Same: code-build runs after code-setup in the base pipeline.
  code-build:
    runAfter:
      - code-setup
    include:
      - dind
    steps:
      - name: run-stage
        onError: stopAndFail
        include:
          - docker-socket
        image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3
        script: |
          #!/usr/bin/env bash
          source $WORKSPACE/$APP_REPO_FOLDER/ci/sps-scripts/build-and-stage.sh

  # The four e2e-* tasks are new nodes not present in the base pipeline.
  # They must be introduced with "from: code-build" so the preprocessor
  # injects them into spec.tasks, making the runAfter reference valid.
  e2e-operator-ocp-latest:
    from: code-build
    runAfter:
      - code-build
    include:
      - dind
    steps:
      - name: run-stage
        onError: stopAndFail
        image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3
        script: |
          #!/usr/bin/env bash
          export CLUSTER_ID=ocp-fyre-latest
          export E2E_MODE=operator
          source $WORKSPACE/$APP_REPO_FOLDER/ci/sps-scripts/e2e-async.sh

  e2e-operator-gke-lowest:
    from: code-build
    runAfter:
      - code-build
    include:
      - dind
    steps:
      - name: run-stage
        onError: stopAndFail
        image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3
        script: |
          #!/usr/bin/env bash
          export CLUSTER_ID=gke-operator-lowest
          export E2E_MODE=operator
          source $WORKSPACE/$APP_REPO_FOLDER/ci/sps-scripts/e2e-async.sh

  e2e-helm-ocp-lowest:
    from: code-build
    runAfter:
      - code-build
    include:
      - dind
    steps:
      - name: run-stage
        onError: stopAndFail
        image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3
        script: |
          #!/usr/bin/env bash
          export CLUSTER_ID=ocp-fyre-lowest
          export E2E_MODE=helm
          source $WORKSPACE/$APP_REPO_FOLDER/ci/sps-scripts/e2e-async.sh

  e2e-helm-gke-latest:
    from: code-build
    runAfter:
      - code-build
    include:
      - dind
    steps:
      - name: run-stage
        onError: stopAndFail
        image: icr.io/continuous-delivery/pipeline/pipeline-base-ubi:3
        script: |
          #!/usr/bin/env bash
          export CLUSTER_ID=gke-operator-latest
          export E2E_MODE=helm
          source $WORKSPACE/$APP_REPO_FOLDER/ci/sps-scripts/e2e-async.sh
